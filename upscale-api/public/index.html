<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Local AI image upscaler — upscale to 4K on your own network.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000'/><text x='32' y='44' font-family='Arial' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'>U</text></svg>">
<title>Upscale — 4K Enhancer</title>
<style>
:root{
  --bg:#000; --panel:#0d0e10; --panel2:#16181a; --line:#2a2d31;
  --txt:#f2f3f5; --dim:#9aa0a6; --faint:#5f646b;
  --accent:#f6f7f8; --accent-ink:#000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mono,.pill{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--txt);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:-1px}
header h1{font-size:17px;font-weight:700;letter-spacing:.4px}
header h1 span{opacity:.5;font-weight:400}
.lan{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:#2fd566;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

label{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
label:first-child{margin-top:0}
.group{margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:64px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:10px 6px;font-size:13px;text-align:center;cursor:pointer;user-select:none;
  transition:border-color .12s,color .12s,background .12s}
.chip.on{background:var(--txt);color:var(--accent-ink);border-color:var(--txt);font-weight:600}
.srange{display:flex;align-items:center;gap:12px}
.srange input[type=range]{flex:1;height:22px;accent-color:#fff;appearance:none;-webkit-appearance:none;background:transparent}
.srange input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:#2a2d31}
.srange input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;margin-top:-7px;box-shadow:0 0 0 3px #000}
.srange input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:#2a2d31}
.srange input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:none}
.srange .val{min-width:44px;text-align:right;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}

.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;flex:1;min-width:150px}
.toggle .tlabel{font-size:14px}
.switch{width:44px;height:26px;background:#25272b;border-radius:999px;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#6b7178;transition:.15s}
.toggle.on .switch{background:#c9ccd0}
.toggle.on .switch::after{left:21px;background:#000}

#drop{border:2px dashed var(--line);border-radius:14px;padding:36px 18px;text-align:center;
  cursor:pointer;transition:border-color .15s;background:var(--panel)}
#drop.hover{border-color:#fff}
#drop .big{font-size:15px;font-weight:600}
#drop .sub{font-size:12px;color:var(--dim);margin-top:6px}
#files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filechip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:13px;display:flex;align-items:center;gap:8px;max-width:100%}
.filechip b{cursor:pointer;color:var(--dim);font-weight:600;padding:0 3px}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:none;
  border-radius:12px;padding:15px;font-size:16px;font-weight:700;letter-spacing:.3px;cursor:pointer;
  transition:transform .06s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

#jobsPanel{content-visibility:auto;contain-intrinsic-size:400px}
.queuehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.queuehead label{margin:0}
.queuehead .count{font-size:12px;color:var(--dim)}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;
  content-visibility:auto;contain-intrinsic-size:120px}
.job .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.job .status{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);
  flex:none;display:flex;align-items:center;gap:5px}
.job .status .tdot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.job .status.processing .tdot{background:#f9d423;animation:pulse .8s infinite}
.job .status.done{color:#fff;border-color:#3a3d41}
.job .status.done .tdot{background:#2fd566}
.job .status.error{color:#fff;border-color:#3a3d41}
.job .status.error .tdot{background:#ff5b5b}
.job .meta{font-size:11px;color:var(--dim);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.job .bar{height:5px;background:#232529;border-radius:999px;margin-top:10px;overflow:hidden}
.job .bar>div{height:100%;background:#fff;border-radius:999px;transition:width .25s linear}
.result{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.result img{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;max-height:320px;object-fit:contain}
.result.pair{display:flex;flex-direction:column;gap:8px}
.result.pair .cell{width:100%}
.result.pair .cell label{display:block;text-align:center;margin:0 0 4px;font-size:10px;letter-spacing:1px;color:var(--dim)}
.result.pair img{width:100%;max-height:260px}
.result.pair.imgonly{display:block}
@media (min-width:560px){
  .result.pair{flex-direction:row}
  .result.pair .cell{flex:1}
}
.filechip img{width:22px;height:22px;object-fit:cover;border-radius:6px;flex:none}
.previso{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;max-height:320px;object-fit:contain;margin-top:12px;opacity:.6}
.actions{display:flex;gap:10px;margin-top:12px}
.actions .btn{flex:1;padding:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;
  padding:11px 20px;border-radius:999px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
  box-shadow:0 8px 30px rgba(0,0,0,.6);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
small{color:var(--faint);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">U</div><h1>UPSCALE <span>— 4K Enhancer</span></h1></div>
  <span class="lan" id="lan"><span class="dot"></span><span id="lanTxt">LAN</span></span>
</header>

<div id="drop">
  <div class="big">Tap to select images</div>
  <div class="sub">or paste from clipboard · multiple files supported</div>
</div>
<div id="files"></div>

<div class="panel">
  <div class="group">
    <label>Model</label>
    <div class="seg" id="modelSeg">
      <div class="chip on" data-v="auto">Auto</div>
      <div class="chip" data-v="photo">Photo</div>
      <div class="chip" data-v="anime">Anime</div>
      <div class="chip" data-v="fast">Fast</div>
      <div class="chip" data-v="hifi">Hifi</div>
    </div>
  </div>
  <label>Scale</label>
  <div class="seg" id="scaleSeg">
    <div class="chip" data-v="2">2x</div>
    <div class="chip" data-v="3">3x</div>
    <div class="chip on" data-v="4">4x</div>
  </div>
  <label>Output</label>
  <div class="seg" id="formatSeg">
    <div class="chip on" data-v="png">PNG</div>
    <div class="chip" data-v="jpg">JPEG</div>
    <div class="chip" data-v="webp">WebP</div>
  </div>
  <label>Denoise <span class="pill" id="dval">auto</span></label>
  <div class="srange"><input type="range" id="denoise" min="0" max="100" value="0"></div>
  <label>Sharpen <span class="pill" id="sval">100%</span></label>
  <div class="srange"><input type="range" id="sharpen" min="0" max="100" value="100"></div>
  <div class="seg" style="margin-top:16px">
    <div class="toggle on" id="faceTgl"><span class="tlabel">Face enhance</span><span class="switch"></span></div>
    <div class="toggle" id="sideTgl"><span class="tlabel">Side-by-side</span><span class="switch"></span></div>
  </div>
  <button class="btn" id="go" style="margin-top:16px">UPSCALE</button>
</div>

<div class="panel hidden" id="jobsPanel">
  <div class="queuehead">
    <label style="margin:0">Queue</label>
    <span class="count" id="queueCount"></span>
  </div>
  <div id="jobs"></div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const state = { files: [], streams: {}, rows: new Map(), live: 0, done: 0 };

fetch("/api/health").then(r => r.json()).then(h => {
  $("#lanTxt").textContent = "LAN · " + (h.models ? h.models.length : 0) + " models";
}).catch(() => $("#lanTxt").textContent = "offline");

const api = (url, opt = {}) => fetch(url, opt);

function segs(id) {
  const box = $(id);
  box.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    box.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  });
  return () => {
    const c = box.querySelector(".chip.on");
    return c ? c.dataset.v : "auto";
  };
}
const valOf = {
  model: segs("#modelSeg"),
  scale: segs("#scaleSeg"),
  format: segs("#formatSeg"),
};

const drop = $("#drop");
drop.onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => addFiles(e.target.files);
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
document.addEventListener("paste", e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) addFiles([item.getAsFile()]);
  }
});

function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith("image/")) continue;
    state.files.push({ file: f, url: URL.createObjectURL(f) });
  }
  renderFiles();
}

function renderFiles() {
  $("#files").innerHTML = state.files.map((f, i) =>
    `<span class="filechip"><img src="${f.url}" alt=""><span class="name">${escapeHtml(f.file.name)}</span> <b data-i="${i}">✕</b></span>`).join("");
  $("#files").querySelectorAll("b").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    URL.revokeObjectURL(state.files[i].url);
    state.files.splice(i, 1);
    renderFiles();
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

$("#denoise").oninput = e => $("#dval").textContent = e.target.value == 0 ? "auto" : e.target.value + "%";
$("#sharpen").oninput = e => $("#sval").textContent = e.target.value + "%";
$("#faceTgl").onclick = () => $("#faceTgl").classList.toggle("on");
$("#sideTgl").onclick = () => $("#sideTgl").classList.toggle("on");

$("#go").onclick = async () => {
  if (!state.files.length) return toast("Select at least one image first");
  const btn = $("#go");
  btn.disabled = true;
  const total = state.files.length;
  let n = 0;
  btn.textContent = "QUEUING 0/" + total + "…";
  for (const f of state.files) {
    const fd = new FormData();
    fd.append("image", f.file);
    fd.append("scale", valOf.scale());
    fd.append("model", valOf.model());
    fd.append("format", valOf.format());
    fd.append("quality", 92);
    fd.append("denoise", $("#denoise").value == 0 ? "auto" : Number($("#denoise").value) / 100);
    fd.append("sharpen", Number($("#sharpen").value) / 100);
    fd.append("saturation", 1);
    fd.append("face", $("#faceTgl").classList.contains("on"));
    fd.append("sideBySide", $("#sideTgl").classList.contains("on"));
    try {
      const r = await api("/api/upload", { method: "POST", body: fd });
      const j = await r.json();
      if (j.id) subscribe(j.id);
      n++;
    } catch (e) { toast("Upload failed"); }
    btn.textContent = "QUEUING " + n + "/" + total + "…";
  }
  state.files = [];
  renderFiles();
  btn.disabled = false;
  btn.textContent = "UPSCALE";
  toast(n + "/" + total + " queued");
};

function subscribe(id) {
  if (state.streams.has(id)) return;
  const es = new EventSource("/api/jobs/" + id + "/stream");
  state.streams.set(id, es);
  es.onmessage = e => {
    const j = JSON.parse(e.data);
    upsert(j);
    if (j.status === "done" || j.status === "error" || j.status === "cancelled") {
      es.close();
      state.streams.delete(id);
    }
  };
  es.onerror = () => { es.close(); state.streams.delete(id); };
}

function buildRow(j) {
  const row = document.createElement("div");
  row.className = "job";
  row.innerHTML = `
    <div class="top">
      <span class="name">${escapeHtml(j.originalName || j.id)}</span>
      <span class="status"><span class="tdot"></span><span class="stext">queued</span></span>
    </div>
    <div class="meta"></div>
    <div class="bar"><div style="width:0%"></div></div>`;
  const ref = {
    row,
    status: row.querySelector(".status"),
    stext: row.querySelector(".stext"),
    meta: row.querySelector(".meta"),
    bar: row.querySelector(".bar > div"),
    resultBox: null,
  };
  $("#jobs").prepend(row);
  state.rows.set(j.id, ref);
  return ref;
}

function upsert(j) {
  let ref = state.rows.get(j.id);
  if (!ref) ref = buildRow(j);
  const t = { queued: "queued", processing: "running", done: "done", error: "failed", cancelled: "cancelled" }[j.status] || j.status;
  ref.status.className = "status " + j.status;
  ref.stext.textContent = t;
  const meta = [];
  if (j.model) meta.push(j.model);
  if (j.scale) meta.push(j.scale + "x");
  if (j.stage) meta.push(j.stage);
  if (j.queuePos) meta.push("pos " + j.queuePos);
  if (j.etaSec != null && j.status === "processing") meta.push("~" + j.etaSec + "s left");
  if (j.durationMs) meta.push(Math.round(j.durationMs / 1000) + "s");
  if (j.outWidth && j.outHeight) meta.push(j.outWidth + "×" + j.outHeight);
  if (j.face !== undefined) meta.push(j.face ? "faces+" : "");
  if (j.error) meta.push(String(j.error).slice(0, 80));
  ref.meta.textContent = meta.filter(Boolean).join(" · ");
  ref.bar.style.width = (j.progress || 0) + "%";

  if (!ref.resultBox && j.status !== "cancelled") {
    ref.resultBox = document.createElement("div");
    ref.resultBox.className = "result pair";
    const sideReq = j.options && j.options.sideBySide;
    ref.resultBox.innerHTML = `
      <div class="cell"><label>BEFORE</label><img class="previso" src="/api/jobs/${j.id}/input?v=1" alt="before"></div>
      <div class="cell" data-role="after"><label>AFTER${sideReq ? "" : ""}</label><img src="" alt="after" style="display:none"></div>`;
    ref.row.appendChild(ref.resultBox);
    ref.resultBox.querySelector(".cell[data-role=after] img").onload = function() {
      this.style.display = "";
    };
  }
  if (j.status === "done" && ref.resultBox) {
    const fmt = j.options && j.options.format === "webp" ? "webp" : j.options && j.options.format === "jpg" ? "jpg" : "png";
    const cb = "?v=" + (j.finishedAt || Date.now());
    const afterCell = ref.resultBox.querySelector(".cell[data-role=after]");
    if (afterCell) {
      const img = afterCell.querySelector("img");
      img.onload = () => { img.style.display = ""; };
      img.src = "/api/jobs/" + j.id + "/result" + cb;
      img.style.display = "";
    }
    if (!ref.dl) {
      const a = document.createElement("div");
      a.className = "actions";
      a.innerHTML = `<a class="btn" href="/api/jobs/${j.id}/result${cb}" download>DOWNLOAD ${fmt.toUpperCase()}</a>`;
      ref.row.appendChild(a);
      ref.dl = a;
    }
  }
  if (j.status === "queued" && !ref.cancelBtn) {
    ref.cancelBtn = document.createElement("div");
    ref.cancelBtn.className = "actions";
    ref.cancelBtn.innerHTML = `<button class="btn ghost" data-cancel="${j.id}">CANCEL</button>`;
    ref.row.appendChild(ref.cancelBtn);
    ref.cancelBtn.querySelector("[data-cancel]").onclick = () => api("/api/jobs/" + j.id + "/cancel", { method: "POST" });
  }
  if (j.status !== "queued" && ref.cancelBtn) { ref.cancelBtn.remove(); ref.cancelBtn = null; }
  renderJobs();
}

function renderJobs() {
  $("#jobsPanel").classList.toggle("hidden", $("#jobs").children.length === 0);
  let live = 0, done = 0, fail = 0;
  for (const ref of state.rows.values()) {
    const s = ref.status.className;
    if (s.includes("processing")) live++;
    else if (s.includes("done")) done++;
    else if (s.includes("error")) fail++;
  }
  $("#queueCount").textContent = [live && live + " running", done && done + " done", fail && fail + " failed"].filter(Boolean).join(" · ");
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 2600);
}


</script>
</body>
</html>
