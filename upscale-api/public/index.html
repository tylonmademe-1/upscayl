<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Upscale — 4K Enhancer</title>
<style>
:root{
  --bg:#101112; --panel:#17181a; --panel2:#1e2023; --line:#2a2d31;
  --txt:#e8eaed; --dim:#9aa0a6; --faint:#6b7178;
  --accent:#f2f2f2; --accent-ink:#0c0d0e; --fill:#3a3d41;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45}
body{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header h1{font-size:18px;font-weight:700;letter-spacing:.4px}
header h1 span{opacity:.55}
.badge{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
label:first-child{margin-top:0}
select,input[type=range],input[type=number]{width:100%;background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;appearance:none}
input[type=range]{padding:0;height:26px;accent-color:#d0d0d0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.toggle .tlabel{font-size:14px}
.switch{width:44px;height:26px;background:#33363a;border-radius:999px;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8f96;transition:.15s}
.toggle.on .switch{background:#c9ccd0}
.toggle.on .switch::after{left:21px;background:#101112}
#drop{border:2px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;
  cursor:pointer;transition:border-color .15s;background:var(--panel)}
#drop.hover{border-color:#e8eaed}
#drop .big{font-size:15px;font-weight:600}
#drop .sub{font-size:12px;color:var(--dim);margin-top:6px}
#files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filechip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font-size:13px;display:flex;align-items:center;gap:8px}
.filechip b{cursor:pointer;color:var(--dim);font-weight:600}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:none;
  border-radius:12px;padding:15px;font-size:16px;font-weight:700;letter-spacing:.3px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.job .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.job .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:#26282c;border-radius:999px;margin-top:10px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.status{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);flex:none}
.status.done{color:#fff;border-color:#fff}
.status.error{color:#fff;border-color:#fff}
.result{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.result img{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;max-height:320px;object-fit:contain}
.result .pair{display:flex;gap:2px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.result .pair img{width:50%;border:none;border-radius:0;max-height:260px}
.actions{display:flex;gap:10px;margin-top:10px}
.actions .btn{flex:1}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;padding:24px}
#gate .box{width:100%;max-width:340px;text-align:center}
#gate input{text-align:center;letter-spacing:6px;font-size:22px;margin:16px 0}
.hidden{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e8eaed;color:#0c0d0e;
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
small{color:var(--faint);font-size:11px}
</style>
</head>
<body>

<header>
  <h1>UPSCALE <span>— 4K Enhancer</span></h1>
  <span class="badge" id="engineBadge">connecting…</span>
</header>

<div id="drop">
  <div class="big">Tap to select images</div>
  <div class="sub">or paste from clipboard · multiple files supported</div>
</div>
<div id="files"></div>

<div class="panel">
  <div class="row">
    <div>
      <label>Scale</label>
      <select id="scale"><option value="4" selected>4x</option><option value="3">3x</option><option value="2">2x</option></select>
    </div>
    <div>
      <label>Model</label>
      <select id="model">
        <option value="auto" selected>Auto (smart)</option>
        <option value="photo">Photo — RealESRGAN</option>
        <option value="anime">Anime — AnimeVideo</option>
        <option value="fast">Fast — General</option>
        <option value="hifi">High Fidelity</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>Output</label>
      <select id="format"><option value="png" selected>PNG</option><option value="jpg">JPEG</option><option value="webp">WebP</option></select>
    </div>
    <div>
      <label>Quality <span id="qval" style="color:var(--txt)">92</span></label>
      <input type="range" id="quality" min="60" max="100" value="92">
    </div>
  </div>
  <label>Denoise <span id="dval" style="color:var(--txt)">auto</span></label>
  <input type="range" id="denoise" min="0" max="100" value="0">
  <label>Sharpen <span id="sval" style="color:var(--txt)">100%</span></label>
  <input type="range" id="sharpen" min="0" max="100" value="100">
  <div class="row" style="margin-top:14px">
    <div class="toggle on" id="faceTgl"><span class="tlabel">Face enhance</span><span class="switch"></span></div>
    <div class="toggle" id="sideTgl"><span class="tlabel">Side-by-side</span><span class="switch"></span></div>
  </div>
  <button class="btn" id="go" style="margin-top:16px">UPSCALE</button>
</div>

<div class="panel hidden" id="jobsPanel">
  <label>Queue</label>
  <div id="jobs"></div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const state = { files: [], streams: {} };

const engineBadge = $("#engineBadge");
fetch("/api/health").then(r => r.json()).then(h => {
  engineBadge.textContent = "engine: " + (h.engine || "?") + " · " + (h.models ? h.models.length : 0) + " models";
}).catch(() => engineBadge.textContent = "offline");

const api = (url, opt = {}) => fetch(url, opt);

const drop = $("#drop");
drop.onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => addFiles(e.target.files);
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
document.addEventListener("paste", e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) addFiles([item.getAsFile()]);
  }
});

function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith("image/")) continue;
    state.files.push(f);
  }
  renderFiles();
}

function renderFiles() {
  $("#files").innerHTML = state.files.map((f, i) =>
    `<span class="filechip">${escapeHtml(f.name)} <b data-i="${i}">✕</b></span>`).join("");
  $("#files").querySelectorAll("b").forEach(b => b.onclick = () => {
    state.files.splice(Number(b.dataset.i), 1);
    renderFiles();
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const updaters = {
  denoise: v => $("#dval").textContent = v == 0 ? "auto" : v + "%",
  sharpen: v => $("#sval").textContent = v + "%",
  quality: v => $("#qval").textContent = v,
};
for (const [id, fn] of Object.entries(updaters)) {
  const el = $("#" + id);
  el.oninput = () => fn(el.value);
}
$("#faceTgl").onclick = () => $("#faceTgl").classList.toggle("on");
$("#sideTgl").onclick = () => $("#sideTgl").classList.toggle("on");

$("#go").onclick = async () => {
  if (!state.files.length) return toast("Select at least one image first");
  const btn = $("#go");
  btn.disabled = true;
  btn.textContent = "QUEUING…";
  const total = state.files.length;
  let n = 0;
  for (const f of state.files) {
    const fd = new FormData();
    fd.append("image", f);
    fd.append("scale", $("#scale").value);
    fd.append("model", $("#model").value);
    fd.append("format", $("#format").value);
    fd.append("quality", $("#quality").value);
    fd.append("denoise", $("#denoise").value == 0 ? "auto" : Number($("#denoise").value) / 100);
    fd.append("sharpen", Number($("#sharpen").value) / 100);
    fd.append("saturation", 1);
    fd.append("face", $("#faceTgl").classList.contains("on"));
    fd.append("sideBySide", $("#sideTgl").classList.contains("on"));
    try {
      const r = await api("/api/upload", { method: "POST", body: fd });
      const j = await r.json();
      if (j.id) subscribe(j.id);
      n++;
    } catch (e) { toast("Upload failed: " + e.message); }
  }
  state.files = [];
  renderFiles();
  btn.disabled = false;
  btn.textContent = "UPSCALE";
  toast(n + "/" + total + " queued");
  renderJobs();
};

const jobsEl = $("#jobs");
const rows = new Map();

function renderJobs() {
  const isEmpty = jobsEl.children.length === 0;
  $("#jobsPanel").classList.toggle("hidden", isEmpty);
}

function subscribe(id) {
  if (state.streams[id]) return;
  const es = new EventSource("/api/jobs/" + id + "/stream");
  state.streams[id] = es;
  es.onmessage = e => {
    const j = JSON.parse(e.data);
    upsert(j);
    if (j.status === "done" || j.status === "error" || j.status === "cancelled") {
      es.close();
      delete state.streams[id];
    }
  };
  es.onerror = () => { es.close(); delete state.streams[id]; };
}

function upsert(j) {
  let row = rows.get(j.id);
  if (!row) {
    row = document.createElement("div");
    row.className = "job";
    jobsEl.prepend(row);
    rows.set(j.id, row);
  }
  const statusText = { queued: "queued", processing: "running", done: "done", error: "failed", cancelled: "cancelled" }[j.status] || j.status;
  let body = `<div class="top"><span class="name">${escapeHtml(j.originalName || j.id)}</span>
    <span class="status ${j.status}">${statusText}</span></div>`;
  body += `<div class="meta">`;
  if (j.model) body += `model: ${j.model} · `;
  if (j.scale) body += `${j.scale}x · `;
  if (j.stage) body += `${j.stage}`;
  if (j.queuePos) body += ` · position ${j.queuePos}`;
  if (j.etaSec != null && j.status === "processing") body += ` · ~${j.etaSec}s left`;
  if (j.durationMs) body += ` · ${Math.round(j.durationMs / 1000)}s`;
  if (j.error) body += ` · ${escapeHtml(String(j.error).slice(0, 90))}`;
  body += `</div>`;
  body += `<div class="bar"><div style="width:${j.progress || 0}%"></div></div>`;
  if (j.status === "done") {
    const out = j.options && j.options.format === "jpg" || (j.options && j.options.format === "jpeg") ? "jpg" : j.options && j.options.format === "webp" ? "webp" : "png";
    body += `<div class="result">`;
    if (j.options && j.options.sideBySide) {
      body += `<div class="pair"><img src="/api/jobs/${j.id}/result" alt="after"><img src="/api/jobs/${j.id}/side" alt="before | after"></div>`;
    } else {
      body += `<img src="/api/jobs/${j.id}/result" alt="result">`;
    }
    body += `</div><div class="actions"><a class="btn" href="/api/jobs/${j.id}/result" download>DOWNLOAD</a></div>`;
  }
  if (j.status === "queued") {
    body += `<div class="actions"><button class="btn ghost" data-cancel="${j.id}">CANCEL</button></div>`;
  }
  row.innerHTML = body;
  const cbtn = row.querySelector("[data-cancel]");
  if (cbtn) cbtn.onclick = () => api("/api/jobs/" + j.id + "/cancel", { method: "POST" });
  renderJobs();
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 2600);
}

api("/api/jobs").then(r => r.json()).then(list => list.forEach(upsert)).catch(() => {});
</script>
</body>
</html>
